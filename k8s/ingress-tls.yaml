apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: games
  namespace: bolblab-games
  annotations:
    cert-manager.io/cluster-issuer: bolblab-cf-issuer
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    external-dns.alpha.kubernetes.io/target: 3f6e31eb-7a1b-46a6-b8cf-421e33238beb.cfargotunnel.com
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - games.bolblab.org
      secretName: games-bolblab-org-tls
  rules:
    - host: games.bolblab.org
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: games-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: games-web
                port:
                  number: 80
