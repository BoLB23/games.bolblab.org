apiVersion: apps/v1
kind: Deployment
metadata:
  name: games-api
  namespace: bolblab-games
  labels:
    app.kubernetes.io/name: games-api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: games-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: games-api
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: migrate-and-seed
          image: ghcr.io/bolb23/games.bolblab.org/api:latest
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -ec
            - /app/.venv/bin/alembic upgrade head && /app/.venv/bin/python -m app.cli seed --production
          env:
            - name: APP_ENV
              value: production
            - name: AUTH_MODE
              value: oidc
            - name: DATABASE_URL
              value: sqlite:////data/game-platform.db
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: games-secrets
                  key: SESSION_SECRET
            - name: SESSION_COOKIE_SECURE
              value: "true"
            - name: CATALOG_ORIGIN
              value: https://games.bolblab.org
            - name: SAMPLE_GAME_ORIGIN
              value: https://games.bolblab.org
            - name: SAMPLE_GAME_LAUNCH_URL
              value: https://games.bolblab.org/games/sample-game/
            - name: FLAPPY_MIKE_ORIGIN
              value: https://games.bolblab.org
            - name: FLAPPY_MIKE_LAUNCH_URL
              value: https://games.bolblab.org/games/flappy-mike/
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: api
          image: ghcr.io/bolb23/games.bolblab.org/api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_ENV
              value: production
            - name: AUTH_MODE
              value: oidc
            - name: DATABASE_URL
              value: sqlite:////data/game-platform.db
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: games-secrets
                  key: SESSION_SECRET
            - name: SESSION_COOKIE_SECURE
              value: "true"
            - name: CATALOG_ORIGIN
              value: https://games.bolblab.org
            - name: SAMPLE_GAME_ORIGIN
              value: https://games.bolblab.org
            - name: SAMPLE_GAME_LAUNCH_URL
              value: https://games.bolblab.org/games/sample-game/
            - name: FLAPPY_MIKE_ORIGIN
              value: https://games.bolblab.org
            - name: FLAPPY_MIKE_LAUNCH_URL
              value: https://games.bolblab.org/games/flappy-mike/
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: games-data
