apiVersion: v1
kind: Secret
metadata:
  name: games-secrets
  namespace: bolblab-games
type: Opaque
stringData:
  SESSION_SECRET: replace-with-a-unique-random-secret-of-at-least-16-characters
  # Required only by k8s/overlays/google-oidc. Keep the real values out of Git.
  OIDC_CLIENT_ID: replace-with-google-oauth-client-id
  OIDC_CLIENT_SECRET: replace-with-google-oauth-client-secret
  # Must exactly match the Google OAuth client's authorized redirect URI.
  OIDC_CALLBACK_URL: https://games.bolblab.org/api/v1/auth/callback
  # Generate with: uv run python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  OIDC_TRANSACTION_SECRET: replace-with-a-fernet-key
  # Optional: a single verified Google account promoted to the clan overlord role.
  OVERLORD_EMAIL: overlord@example.invalid
