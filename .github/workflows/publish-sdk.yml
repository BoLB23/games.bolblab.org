name: Publish game client SDK

on:
  push:
    tags:
      - 'sdk-v*'

permissions:
  contents: read

concurrency:
  group: publish-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish SDK
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@bolb23'
      - run: npm ci
      - name: Verify release tag matches SDK version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const { version } = JSON.parse(readFileSync('packages/game-client-sdk/package.json', 'utf8'));
          const expectedTag = `sdk-v${version}`;
          if (process.env.RELEASE_TAG !== expectedTag) {
            throw new Error(`Expected release tag ${expectedTag}; received ${process.env.RELEASE_TAG}`);
          }
          NODE
      - run: npm run lint --workspace @bolb23/game-client-sdk
      - run: npm run typecheck --workspace @bolb23/game-client-sdk
      - run: npm run test --workspace @bolb23/game-client-sdk
      - run: npm run build --workspace @bolb23/game-client-sdk
      - run: npm pack --dry-run --workspace @bolb23/game-client-sdk
      - name: Publish immutable SDK version
        run: npm publish --workspace @bolb23/game-client-sdk --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
