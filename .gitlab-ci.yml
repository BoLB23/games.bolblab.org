stages:
  - lint
  - test
  - build

default:
  interruptible: true

node:lint-and-typecheck:
  stage: lint
  image: node:22-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint:workspaces
    - npm run typecheck:workspaces

api:lint-and-typecheck:
  stage: lint
  image: ghcr.io/astral-sh/uv:0.8-python3.13-bookworm-slim
  script:
    - cd apps/api
    - uv sync --locked --group dev
    - uv run ruff check .
    - uv run mypy app

node:test:
  stage: test
  image: node:22-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run test:workspaces

api:test:
  stage: test
  image: ghcr.io/astral-sh/uv:0.8-python3.13-bookworm-slim
  script:
    - cd apps/api
    - uv sync --locked --group dev
    - uv run pytest

build:images:
  stage: build
  image: docker:27-cli
  services:
    - name: docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker build --pull -f docker/api.Dockerfile -t "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA" .
    - docker build --pull -f docker/web.Dockerfile -t "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA"
