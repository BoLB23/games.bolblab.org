server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /games/sample-game/ {
        try_files $uri $uri/ /games/sample-game/index.html;
    }

    location /games/flappy-mike/ {
        try_files $uri $uri/ /games/flappy-mike/index.html;
    }

    # These paths are owned by the catalog SPA. Keep directory redirects from
    # sending browser routes to the standalone game's static directory.
    location = /games {
        try_files /index.html =404;
    }

    location = /games/ {
        try_files /index.html =404;
    }

    location = /games/sample-game {
        try_files /index.html =404;
    }

    location = /games/flappy-mike {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
