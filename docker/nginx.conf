server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /games/sample-game/ {
        try_files $uri $uri/ /games/sample-game/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
