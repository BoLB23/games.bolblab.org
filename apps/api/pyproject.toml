[project]
name = "game-platform-api"
version = "0.1.0"
description = "API for the private game platform"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "authlib>=1.4,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1"
]

[dependency-groups]
dev = ["mypy>=1.13,<2", "pytest>=8.3,<9", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = ["authlib.*"]
ignore_missing_imports = true
